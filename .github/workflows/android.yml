name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The GitHub-hosted Ubuntu image already includes the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v5

      - name: Check generated plan data is up to date
        run: |
          python3 tools/gen_plan.py
          python3 tools/gen_illustrations.py
          python3 tools/gen_foods.py
          python3 tools/gen_recipes.py
          git diff --exit-code

      - name: Unit tests
        run: ./gradlew :core:test --console=plain

      # Old save files still load; screens and widget sizes render (Paparazzi, no emulator).
      - name: App tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "Eugene26.2-build${{ github.run_number }}.apk"

      - name: Upload APK (zipped workflow artifact)
        uses: actions/upload-artifact@v5
        with:
          name: EugeneMarathon-apk
          path: Eugene26.2-build${{ github.run_number }}.apk

      # Release assets download as a plain .apk, so the phone can install it directly.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: Eugene26.2-build${{ github.run_number }}.apk
          TITLE: Latest build (#${{ github.run_number }})
          NOTES: Open this page on your phone and tap the .apk to install. It updates the app in place and keeps your logs.
        run: |
          set -euo pipefail
          # Remove any half-made draft releases left by earlier runs (they hide the APK from the public page).
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft) | .id' |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"; done
          # Move the "latest" tag to this commit instead of deleting and re-creating it.
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release view latest --json assets --jq '.assets[].name' |
              while read -r name; do gh release delete-asset latest "$name" --yes; done
            gh release upload latest "$APK" --clobber
            gh release edit latest --title "$TITLE" --notes "$NOTES" --prerelease --draft=false
          else
            gh release create latest "$APK" --title "$TITLE" --notes "$NOTES" --prerelease --verify-tag
          fi
          # Fail loudly if the release didn't end up published with the APK on it.
          gh release view latest --json isDraft,assets --jq 'if .isDraft then error("release is still a draft") else .assets[].name end' | grep -q '\.apk$'

      - name: Publish versioned release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Eugene26.2-build${{ github.run_number }}.apk

name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The GitHub-hosted Ubuntu image already includes the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v5

      - name: Check generated plan data is up to date
        run: |
          python3 tools/gen_plan.py
          python3 tools/gen_illustrations.py
          git diff --exit-code

      - name: Unit tests
        run: ./gradlew :core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "Eugene26.2-build${{ github.run_number }}.apk"

      - name: Upload APK (zipped workflow artifact)
        uses: actions/upload-artifact@v5
        with:
          name: EugeneMarathon-apk
          path: Eugene26.2-build${{ github.run_number }}.apk

      # Release assets download as a plain .apk, so the phone can install it directly.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "Eugene26.2-build${{ github.run_number }}.apk" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Open this page on your phone and tap the .apk to install. It updates the app in place and keeps your logs." \
            --target "${{ github.sha }}" --prerelease

      - name: Publish versioned release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Eugene26.2-build${{ github.run_number }}.apk

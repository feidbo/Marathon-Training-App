name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Check generated plan data is up to date
        run: |
          python3 tools/gen_plan.py
          python3 tools/gen_illustrations.py
          git diff --exit-code

      - name: Unit tests
        run: ./gradlew :core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EugeneMarathon-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
